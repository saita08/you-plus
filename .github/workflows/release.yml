name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: チェンジログから最新版を読み取る
        id: changelog
        run: |
          version=$(grep -m1 -oP '## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "リリース済みの版がまだない(Unreleased のみ)。何もしない"
            exit 0
          fi
          echo "## What's Changed" > release_notes.md
          awk '/^## \['"${version}"'\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md >> release_notes.md
          cat release_notes.md

      - name: タグが未作成か確認する
        id: check_tag
        if: steps.changelog.outputs.version != ''
        run: |
          if git rev-parse "${{ steps.changelog.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: スキルごとに .skill を作る
        if: steps.changelog.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        run: |
          shopt -s nullglob
          mkdir -p dist
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -r "../dist/${name}.skill" "$name")
          done

      - name: タグを打って Release を作る
        if: steps.changelog.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          git tag "${{ steps.changelog.outputs.tag }}"
          git push origin "${{ steps.changelog.outputs.tag }}"
          files=(dist/*.skill)
          gh release create "${{ steps.changelog.outputs.tag }}" "${files[@]}" \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes-file release_notes.md
